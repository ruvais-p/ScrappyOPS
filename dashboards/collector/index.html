<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B1E24">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scrappy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Scrappy Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
:root{
  --ox:#8B1E24;--ox7:#5E1318;--ink:#2A2426;--pearl:#F6F4F2;--paper:#EFEEEC;--stone:#6E6866;
  --line:#E5E0DB;--green:#2F5523;--green-t:#E7F0E2;--blue:#2B5470;--blue-t:#E6EEF4;--amber-t:#FBF1DE;--amber-d:#6B4507;--ox-t:#FBEFEA;
  --head:'Space Grotesk',Arial,sans-serif;--body:'DM Sans',Arial,sans-serif;
  --r:16px;--sh:0 1px 2px rgba(42,36,38,.07),0 5px 12px -8px rgba(42,36,38,.28);
  --ease:cubic-bezier(.22,1,.36,1);--nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pearl);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--ox)}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input{font:inherit}
:focus-visible{outline:3px solid var(--ox);outline-offset:2px}
.hidden{display:none!important}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.88)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(139,30,36,.45)}100%{box-shadow:0 0 0 12px rgba(139,30,36,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes load{0%{width:0}60%{width:70%}100%{width:90%}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
#app.enter>*{animation:rise .55s var(--ease) both}
#app.enter>*:nth-child(2){animation-delay:.07s}
#app.enter>*:nth-child(3){animation-delay:.14s}
#app.enter>*:nth-child(4){animation-delay:.21s}
#app.enter>*:nth-child(5){animation-delay:.28s}
#app.enter>*:nth-child(n+6){animation-delay:.34s}
#app.enter .kpi{animation:rise .5s var(--ease) both}
#app.enter .kpi:nth-child(2){animation-delay:.08s}
#app.enter .kpi:nth-child(3){animation-delay:.16s}
#app.enter .kpi:nth-child(4){animation-delay:.24s}
#app.enter .lead{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + .2s)}
#app.enter .item{animation:rise .45s var(--ease) both}
#app.enter .bar i{animation:barin .9s var(--ease) both;animation-delay:.3s}
#topbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--ox),#E8A1A5);z-index:100;opacity:0;transition:opacity .25s}
#topbar.on{opacity:1;animation:load 1.8s var(--ease) forwards}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px;background:radial-gradient(900px 500px at 50% -10%,#8B1E24 0%,#3a1a1d 45%,#2A2426 100%)}
.login form{background:#fff;width:100%;max-width:390px;padding:30px 26px;display:flex;flex-direction:column;gap:15px;border-radius:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);animation:rise .7s var(--ease) both}
.login form.shake{animation:shake .5s}
.login-logo{width:180px;display:block}
.login h1{font-size:26px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input{padding:14px 14px;border:1.5px solid var(--line);background:var(--pearl);color:var(--ink);font-size:16px;border-radius:12px;transition:border-color .2s,box-shadow .2s,background .2s;width:100%}
.field input:focus{outline:0;border-color:var(--ox);background:#fff;box-shadow:0 0 0 4px rgba(139,30,36,.12)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ox);font-weight:700;font-size:13px;padding:10px}
.err{color:var(--ox);font-size:14px;min-height:20px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:linear-gradient(180deg,#2e2729 0%,#201b1d 100%);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{width:150px;padding-left:4px}
.logo img{width:100%;display:block}
.fr-card{border:1px solid #ffffff2b;border-radius:14px;background:#ffffff0d;padding:12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.fr-card small{font-size:10px;letter-spacing:.14em;font-weight:700;color:#D3BEC0}
.fr-card b{font-family:var(--head);font-size:17px;letter-spacing:-.02em;line-height:1.2}
.fr-card .frc{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;letter-spacing:.1em;background:var(--ox);padding:2px 10px;border-radius:6px}
.who small{display:block;font-size:10px;letter-spacing:.14em;font-weight:700;color:#D3BEC0}
.who b{display:block;font-size:16px}
.who span{font-size:12px;color:#D3D1C7}
nav{display:flex;flex-direction:column;gap:4px}
nav a{position:relative;color:#DDD7D8;text-decoration:none;font-size:15px;padding:12px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;transition:background .2s,color .2s,transform .2s var(--ease)}
nav a svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:#ffffff14;transform:translateX(3px)}
nav a.on{background:var(--ox);color:#fff;font-weight:700;box-shadow:0 8px 18px -8px rgba(139,30,36,.9)}
nav a .count{margin-left:auto;font-size:12px;font-weight:700;background:#ffffff2e;padding:1px 8px;border-radius:99px}
nav a .count:empty{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:#D3D1C7}
.side-foot button{background:transparent;border:1px solid #ffffff40;color:#fff;padding:11px 14px;font-size:13px;text-align:left;border-radius:12px;transition:background .2s}
.side-foot button:hover{background:#ffffff14}
.servicebar{display:flex;height:6px;border-radius:6px;overflow:hidden}
.servicebar i{flex:1}
main{flex:1;min-width:0;padding:32px 40px 60px;display:flex;flex-direction:column;gap:22px;max-width:1280px}
.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:700;color:var(--ox);text-transform:uppercase}
h1{margin:4px 0;font-family:var(--head);font-size:36px;letter-spacing:-.04em;line-height:1.08}
h2{margin:0;font-family:var(--head);font-size:21px;letter-spacing:-.03em;line-height:1.15}
h3{margin:0;font-family:var(--head);font-size:18px;letter-spacing:-.02em}
.muted{color:var(--stone)}
.small{font-size:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head-act{display:flex;gap:10px;align-items:center}
.backbtn{background:none;border:0;color:var(--ox);font-weight:700;font-size:14px;padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.backbtn:hover{text-decoration:underline}

/* ---------- buttons ---------- */
.btn{border:0;background:linear-gradient(180deg,#9a2329,var(--ox));color:#fff;font-weight:700;font-size:15px;padding:14px 22px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:50px;border-radius:14px;box-shadow:0 8px 18px -10px rgba(139,30,36,.9);transition:transform .2s var(--ease),box-shadow .2s,background .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(139,30,36,.95)}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--paper)}
.btn.green{background:linear-gradient(180deg,#25903f,#1F7A3A);box-shadow:0 8px 18px -10px rgba(31,122,58,.9)}
.btn.block{width:100%}
.btn.busy{opacity:.7;pointer-events:none}
.btn.busy::after{content:"";width:16px;height:16px;border:2.5px solid #ffffff80;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn:disabled{box-shadow:none;transform:none;filter:grayscale(.4)}
.maplink{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;vertical-align:middle;text-decoration:none;background:#fff;color:var(--ox);border:1.5px solid var(--ox);border-radius:50%;flex:none;transition:transform .2s var(--ease),background .2s,color .2s}
.maplink:hover{background:var(--ox);color:#fff;transform:scale(1.08)}
.maplink:active{transform:scale(.92)}
.maplink svg{width:22px;height:22px;fill:currentColor}
.rowend{display:inline-flex;align-items:center;justify-content:flex-end;gap:14px}
.linkbtn{background:none;border:0;color:var(--ox);font-weight:700;font-size:14px;padding:8px 0;text-decoration:underline}

/* ---------- cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s}
a.kpi:hover{transform:translateY(-3px)}
.kpi.dark{background:linear-gradient(135deg,#3a3033,#2A2426);color:#fff;border-color:var(--ink)}
.kpi .l{font-size:12px;font-weight:500;color:var(--stone)}
.kpi.dark .l,.kpi.dark .s{color:#D3D1C7}
.kpi .v{font-family:var(--head);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--stone)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.grow{flex:999 1 460px;min-width:0}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.pad{padding:18px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:500;padding:9px 16px;min-height:42px;border-radius:99px;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.tab:hover{border-color:var(--ink)}
.tab:active{transform:scale(.95)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;color:var(--stone);font-weight:700;text-align:left;padding:11px 8px}
td{padding:13px 8px;border-top:1px solid var(--paper);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:#FBFAF9}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
.r{text-align:right}
.b{font-weight:700}
.badge{font-size:12px;font-weight:700;padding:5px 11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:99px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-prog{background:var(--ox-t);color:var(--ox)}
.b-sched{background:var(--paper);color:var(--ink)}
.b-ok{background:var(--green-t);color:var(--green)}
.b-cash{background:var(--amber-t);color:var(--amber-d)}
.b-flag{background:var(--ox-t);color:var(--ox)}
.bar{height:9px;background:var(--paper);border-radius:9px;overflow:hidden}
.bar i{display:block;height:9px;background:linear-gradient(90deg,var(--ox),#C4474E);border-radius:9px;transform-origin:left}
.row-split{display:flex;justify-content:space-between;gap:10px}
.total{border-top:2px solid var(--ink);padding-top:10px;font-weight:700}

/* ---------- lead cards ---------- */
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:16px}
.leads.bare{padding:0}
.lead{content-visibility:auto;contain-intrinsic-size:auto 175px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.lead:hover{transform:translateY(-3px)}
.lead.live{border-color:var(--ox);box-shadow:0 0 0 3px var(--ox-t),var(--sh)}
.lead-top{display:flex;gap:12px;align-items:flex-start}
.lead-time{flex:none;min-width:66px;text-align:center;background:var(--paper);border-radius:12px;padding:9px 6px}
.lead-time b{font-family:var(--head);font-size:15px;display:block;line-height:1.15}
.lead-time small{font-size:11px;color:var(--stone)}
.lead-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lead-main .nm{font-size:16px;font-weight:700}
.lead-main .sub{font-size:13px;color:var(--stone)}
.lead-main .addr{font-size:13px;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-top .badge{flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--paper);border-radius:99px;padding:3px 10px;color:var(--stone)}
.lead-act{display:flex;align-items:center;gap:10px}
.lead-act .btn{flex:1}
.lead-done{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--stone);font-size:13px}
.lead-done b{color:var(--green);font-size:17px;font-family:var(--head)}

/* ---------- next pickup hero ---------- */
.next{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:22px;background:linear-gradient(135deg,#9a2329 0%,#5E1318 100%);box-shadow:0 20px 40px -22px rgba(94,19,24,.9);display:flex;flex-direction:column;gap:10px}
.next::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:#ffffff14;pointer-events:none}
.next .tag{font-size:11px;letter-spacing:.16em;font-weight:700;color:#F1D3D5}
.next h2{font-size:28px;color:#fff;letter-spacing:-.03em}
.next .soft{color:#F1D3D5;font-size:14px}
.next-act{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;position:relative;z-index:1}
.next .btn{background:#fff;color:var(--ox);box-shadow:0 10px 20px -12px rgba(0,0,0,.6);flex:1 1 140px}
.next .maplink{background:transparent;color:#fff;border-color:#ffffff80}
.next .maplink:hover{background:#fff;color:var(--ox)}

/* ---------- pickup screen ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--stone);display:flex;flex-direction:column;gap:2px;min-width:0;transition:background .4s,color .4s}
.steps li small{font-size:11px;letter-spacing:.1em;font-weight:700}
.steps li b{font-size:13px;line-height:1.25}
.steps li.done{background:var(--green);border-color:var(--green);color:#fff}
.steps li.cur{background:var(--ox);border-color:var(--ox);color:#fff;animation:ring 1.8s 3}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--paper);border-left:4px solid transparent;transition:background .25s,border-color .25s}
.item.on{background:#FFF9F0;border-left-color:var(--ox)}
.item .nm{display:block;font-size:16px;font-weight:700}
.item .rt{display:block;font-size:13px;color:var(--stone)}
.qty{display:flex;align-items:center;gap:10px}
.qty input{width:100px;font-size:18px;font-weight:700;padding:12px 12px;border:1.5px solid var(--line);background:var(--pearl);color:var(--ink);text-align:right;border-radius:12px;transition:border-color .2s,box-shadow .2s,background .2s}
.qty input:focus{outline:0;border-color:var(--ox);background:#fff;box-shadow:0 0 0 4px rgba(139,30,36,.12)}
.qty input:disabled{background:var(--paper);color:var(--stone)}
.amt{min-width:78px;text-align:right;font-weight:700;font-size:15px}
.opt{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:15px;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--ink);transition:border-color .2s,background .2s,transform .2s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.opt.on{background:var(--ox-t);border-color:var(--ox)}
.opt b{font-size:15px}
.opt span{font-size:13px;color:var(--stone)}
.closed-card{background:linear-gradient(135deg,#25903f,#14532a);color:#fff;padding:22px;display:flex;flex-direction:column;gap:10px;border-radius:20px;box-shadow:0 20px 40px -22px rgba(20,83,42,.9);animation:pop .6s var(--ease) both}
.closed-card .muted{color:#D8EFDD}
.check{width:60px;height:60px}
.check circle{fill:none;stroke:#ffffff55;stroke-width:3}
.check path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .35s var(--ease) forwards}
.totalpill{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;inset:0;background:rgba(20,12,14,.55);animation:fadein .25s both}
.sheet .panel{position:relative;background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:slideup .38s var(--ease) both}
@media (min-width:861px){.sheet{align-items:center}.sheet .panel{border-radius:22px}}
.reasons{display:grid;gap:8px}
.reasons .opt{padding:12px 14px}
.field textarea{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--pearl);color:var(--ink);font:inherit;font-size:15px;resize:vertical;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
.field textarea:focus{outline:0;border-color:var(--ox);background:#fff;box-shadow:0 0 0 4px rgba(139,30,36,.12)}
.lead-fail{background:var(--ox-t);color:var(--ox);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.lead.bad{border-color:#E8B7B9}
.lead-more{display:flex;justify-content:center;margin-top:-4px}
.lead-more .linkbtn{font-size:13px;color:var(--stone);font-weight:500;padding:4px 8px}
@media (hover:none){.btn:hover,.lead:hover,a.kpi:hover,.maplink:hover,.opt:hover:not(:disabled),nav a:hover{transform:none}}
.cash-hero{background:linear-gradient(135deg,#9a2329,#5E1318);color:#fff;padding:26px 28px;display:flex;flex-direction:column;gap:12px;border-radius:22px;box-shadow:0 20px 40px -22px rgba(94,19,24,.9)}
.cash-hero .big{font-family:var(--head);font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.cash-hero .soft{color:#F1D3D5;font-size:13px}
.empty{padding:40px 18px;text-align:center;color:var(--stone);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty svg{width:46px;height:46px;stroke:var(--line);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.empty b{color:var(--ink)}
.notice{background:var(--amber-t);color:var(--amber-d);padding:12px 14px;font-size:13px;border-radius:12px}

/* ---------- toast / loading ---------- */

<body>

<div id="login" class="login hidden">
  <img class="login-logo" src="../logo.webp" alt="Scrappy">
  <form id="login-form" novalidate>
    <h1 style="font-family:var(--head);letter-spacing:-.03em">Collector login</h1>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" data-pw aria-label="Show password">Show</button></div></div>
    <div class="err" id="login-err" role="alert"></div>

    <nav aria-label="Main">
      <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#pickup" data-view="pickup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg><span>Pickup</span><span class="count" id="nav-open"></span></a>
      <a href="#loads" data-view="loads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 6.5h11v9h-11zM13.5 9.5h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Load</span></a>
      <a href="#cash" data-view="cash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><path d="M3 7.5V18a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5.5A2.5 2.5 0 0 1 3 7.5z"/><circle cx="16.5" cy="14.5" r="1"/></svg><span>Cash</span></a>

    </div>
  </aside>
  <main id="app" aria-live="polite"><div class="sk" style="height:34px;width:55%"></div><div class="sk" style="height:150px"></div><div class="sk" style="height:220px"></div></main>

<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   Scrappy Collector Dashboard · connected to Supabase
   The publishable key below is safe to include in a web page.
   Data is protected by the database's access rules.
   ========================================================= */
const SUPABASE_URL = 'https://suluhhbomiuwwocrfpxg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_45-7fJZdo_jovQfhN0dhtw_FNmo1Fw1';
const SESSION_KEY = 'scrappy_session';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
/* the customer's position comes with the lead (latitude, longitude); Google Maps opens with directions to it */
function mapLink(l) {
  const la = Number(l.latitude), lo = Number(l.longitude);
  if (l.latitude == null || l.longitude == null || !isFinite(la) || !isFinite(lo)) return '';
  return `<a class="maplink" href="https://www.google.com/maps/dir/?api=1&destination=${la},${lo}&travelmode=driving" target="_blank" rel="noopener" title="Open in Google Maps" aria-label="Open ${esc(l.customer_name)} in Google Maps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></a>`;
}
function callLink(l) {
  const d = String(l.phone || '').replace(/\D/g, '').slice(-10);
  if (d.length !== 10) return '';
  return `<a class="maplink" href="tel:+91${d}" title="Call ${d}" aria-label="Call ${esc(l.customer_name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></a>`;
}
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v || 0);
const rs = n => '₹' + Math.round(num(n)).toLocaleString('en-IN');
const kg = n => (Math.round(num(n) * 10) / 10).toFixed(1);
const time = t => t ? new Date(t).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' }).toUpperCase() : '—';
const day = t => t ? new Date(t).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short' }) : '';
function toast(msg, bad) {
  const t = $('#toast'); t.innerHTML = '<span class="ic">' + (bad ? '!' : '✓') + '</span><span></span>'; t.lastChild.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), bad ? 4500 : 2800);
}
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

/* ---------- Supabase connection (plain HTTPS, no library needed) ---------- */
let session = load(SESSION_KEY);

async function authCall(grant, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || 'Login failed');
  session = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + (data.expires_in || 3600) * 1000, user_id: data.user && data.user.id };
  store(SESSION_KEY, session);
  return session;
}
async function ensureFresh() {
  if (session && session.expires_at - Date.now() < 300000) {
    try { await authCall('refresh_token', { refresh_token: session.refresh_token }); }
    catch (e) { logout('You were logged out. This account may have been opened on another device, or the session expired.'); throw e; }
  }
}
async function api(path, { method = 'GET', body, retry = true } = {}) {
  await ensureFresh();
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method,
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session ? session.access_token : SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (res.status === 401 && retry && session) {
    try { await authCall('refresh_token', { refresh_token: session.refresh_token }); } catch (e) { logout('You were logged out. This account may have been opened on another device, or the session expired.'); throw e; }
    return api(path, { method, body, retry: false });
  }
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && (data.message || data.msg)) || `Request failed (${res.status})`);
  return data;
}
const rest = q => api('/rest/v1/' + q);
const rpc = (fn, args = {}) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args });

/* PDF bill: made on the server from the database; returns a link that works for a year */
async function makePdf(billId) {
  await ensureFresh();
  const call = () => fetch(`${SUPABASE_URL}/functions/v1/bill-pdf`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: billId })
  });
  let res = await call();
  if (res.status === 401) {
    try { await authCall('refresh_token', { refresh_token: session.refresh_token }); res = await call(); } catch (e) {}
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.url) throw new Error(data.error || 'Could not make the PDF bill.');
  store('pdfl_' + billId, data.url);
  return data.url;
}
/* WhatsApp text = bill summary from the database + link to the PDF */
async function buildWhatsApp(billId, reusePdf = false) {
  const r = await rpc('bill_whatsapp', { p_bill_id: billId });
  const w = Array.isArray(r) ? r[0] : r;
  let msg = w.message, pdfOk = true;
  const who = (S.profile && S.profile.full_name) || 'the collector';
  try {
    const url = (reusePdf && load('pdfl_' + billId)) || await makePdf(billId);
    msg += `\n\nYour bill (PDF): ${url}\nPlease check it and tell ${who} if all is correct. This same link shows PAID once we pay you.`;
  } catch (e) { pdfOk = false; }
  msg += '\n\nScrappy · Waste management, made simple.';
  store('wa_' + billId, `https://wa.me/${w.whatsapp_number}?text=${encodeURIComponent(msg)}`);
  return pdfOk;
}
async function sharePdfFile(billId, billNo) {
  const url = load('pdfl_' + billId) || await makePdf(billId);
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], `Scrappy-bill-${billNo}.pdf`, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file], title: `Scrappy bill ${billNo}` });
    return true;
  }
  window.open(url, '_blank', 'noopener');
  return false;
}

/* ---------- state ---------- */
const S = {
  view: 'dashboard', leadTab: 'open', loadTab: null,
  profile: null, leads: [], rates: [], cash: 0, ledger: [], loads: [], loadTotals: [], paidBills: [],
  activeLead: null, billItems: [], method: null, busy: false
};
const openLoad = () => S.loads.find(l => l.status === 'open');
const leadById = id => S.leads.find(l => l.lead_id === id);
const openLeads = () => S.leads.filter(l => l.status !== 'closed' && l.status !== 'failed');
const failedLeads = () => S.leads.filter(l => l.status === 'failed');
const closedLeads = () => S.leads.filter(l => l.status === 'closed');
const rateName = id => (S.rates.find(r => r.item_id === id) || {}).item_name || 'Item';

async function refresh() {
  const uid = session.user_id;
  const [profile, leads, rates, cash, ledger, loads, totals, paid] = await Promise.all([
    rest(`profiles?select=full_name,role,territory,vehicle_no,franchise_id&id=eq.${uid}`),
    rpc('my_leads'),
    rest('current_rates?select=item_id,item_name,rate_per_kg&order=item_id'),
    rest(`driver_cash_in_hand?select=cash_in_hand&driver_id=eq.${uid}`),
    rest(`cash_ledger?select=id,entry_type,amount,bill_id,note,created_at&driver_id=eq.${uid}&order=created_at.asc,id.asc`),
    rest('loads?select=id,code,status,started_at,submitted_at,warehouse_kg&order=id.desc&limit=10'),
    rest('load_item_totals?select=load_id,item_name,total_kg,total_value'),
    rest('bill_totals?select=bill_id,bill_no,load_id,payment_method,total_kg,total_amount&status=eq.paid')
  ]);
  S.profile = profile[0] || null; S.leads = leads || []; S.rates = rates || [];
  S.cash = num((cash[0] || {}).cash_in_hand); S.ledger = ledger || []; S.loads = loads || [];
  S.loadTotals = totals || []; S.paidBills = paid || [];
  if (S.activeLead) {
    const l = leadById(S.activeLead);
    S.billItems = l && l.bill_id ? await rest(`bill_items?select=item_id,qty_kg,rate_per_kg,amount&bill_id=eq.${l.bill_id}`) : [];
    S.waOpenedAt = null;
    if (l && l.bill_id && l.bill_status === 'sent') {
      const b = await rest(`bills?select=whatsapp_opened_at&id=eq.${l.bill_id}`);
      S.waOpenedAt = (b[0] || {}).whatsapp_opened_at || null;
      await buildWhatsApp(l.bill_id, true); /* always rebuilt so a corrected phone number is used */
    }
  }
}

/* ---------- views ---------- */
/* ---------- small UI helpers (look and feel only) ---------- */
const greet = () => {
  const h = +new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false }) % 24;
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
};
const emptyState = (title, sub) => `<div class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg><b>${title}</b><span>${sub}</span></div>`;
const skeleton = () => `<div class="sk" style="height:34px;width:55%"></div><div class="sk" style="height:150px"></div>
  <div class="kpis"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div>
  <div class="sk" style="height:220px"></div>`;
function animateCounts() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = num(el.dataset.count); if (!to) return;
    const f = el.dataset.fmt === 'kg' ? n => kg(n) + ' kg' : rs, t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 750), e = 1 - Math.pow(1 - p, 3); el.textContent = f(to * e); if (p < 1) requestAnimationFrame(step); else el.textContent = f(to); };
    requestAnimationFrame(step);
  });
}
function shake() { const f = $('#login-form'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }

function leadCard(l, i) {
  const done = l.status === 'closed', failed = l.status === 'failed', canFail = !done && !failed && (!l.bill_status || l.bill_status === 'draft');
  return `<article class="lead ${l.status === 'in_progress' ? 'live' : ''} ${failed ? 'bad' : ''}" style="--i:${i}">
    <div class="lead-top">
      <div class="lead-time"><b>${time(l.slot)}</b><small>${day(l.slot)}</small></div>
      <div class="lead-main"><span class="nm">${esc(l.customer_name)}</span><span class="sub">${esc(l.lead_code)}${l.area ? ' · ' + esc(l.area) : ''}</span>${l.address ? `<span class="addr">${esc(l.address)}</span>` : ''}</div>
      ${badge(l)}
    </div>
    ${l.items_said && !done && !failed ? `<div class="chips"><span class="chip">Said: ${esc(l.items_said)}</span></div>` : ''}
    ${failed ? `<div class="lead-fail"><b>${esc(l.fail_reason)}</b>${l.fail_note ? '<br>' + esc(l.fail_note) : ''}<br><span class="small">${day(l.failed_at)} ${time(l.failed_at)} · the supervisor will give it out again</span></div>`
      : done ? `<div class="lead-done"><span>${esc(l.bill_no || '')}</span><b>${rs(l.total_amount)}</b></div>`
      : `<div class="lead-act"><button class="btn" data-act="open-lead" data-id="${l.lead_id}">${l.status === 'in_progress' ? 'Continue pickup' : 'Start pickup'} →</button>${mapLink(l)}${callLink(l)}</div>`}
  </article>`;
}

function vDashboard() {
  const p = S.profile || {}, open = openLeads(), closed = closedLeads(), ol = openLoad();
  const next = open.find(l => l.status === 'in_progress') || open[0];
  const totals = ol ? S.loadTotals.filter(t => t.load_id === ol.id) : [];
  const totalKg = totals.reduce((a, t) => a + num(t.total_kg), 0);
  const maxKg = Math.max(1, ...totals.map(t => num(t.total_kg)));

/* ---------- render & routing ---------- */
const VIEWS = { dashboard: vDashboard, pickup: vPickup, loads: vLoads, cash: vCash };
let lastKey = null;

  const f = document.activeElement, keep = f && f.dataset && f.dataset.act === 'qty' ? { item: f.dataset.item, value: f.value } : null;
  const key = v + ':' + (v === 'pickup' ? S.activeLead : ''), app = $('#app'), changed = key !== lastKey;
  if (!changed) app.classList.remove('enter');
  app.innerHTML = VIEWS[v]();
  if (changed) { lastKey = key; app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); animateCounts(); }
  if (keep) { const n = document.querySelector(`input[data-act="qty"][data-item="${keep.item}"]`); if (n && !n.disabled) { n.value = keep.value; n.focus(); } }
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.view === v));
  $('#nav-open').textContent = openLeads().length || '';
}

/* keep Load and Cash up to date: the warehouse weighs loads and counts cash while the driver is looking */
let bgBusy = false;
async function bgRefresh() {
  const v = location.hash.slice(1);
  if (bgBusy || !session || !S.profile || document.visibilityState !== 'visible' || (v !== 'loads' && v !== 'cash')) return;
  bgBusy = true;

  bgBusy = false;

setInterval(bgRefresh, 15000);
document.addEventListener('visibilitychange', bgRefresh);

/* ---------- live bill: amounts update while typing; saves are queued, never dropped ---------- */
const billLinesHtml = rows => rows.length ? rows.map(r => '<div class="row-split" style="font-size:14px;border-top:1px solid var(--paper);padding-top:8px"><span>' + esc(r.name) + ' · ' + kg(r.kg) + ' kg × ₹' + num(r.rate) + '</span><span class="b">' + rs(r.amt) + '</span></div>').join('') : '<span class="muted">No items yet.</span>';
function liveBill() {
  const lines = document.getElementById('bill-lines'); if (!lines) return;
  const rows = [];
  document.querySelectorAll('input[data-act="qty"]').forEach(inp => {
    const r = S.rates.find(x => x.item_id === +inp.dataset.item), v = parseFloat(inp.value), ok = r && v > 0;
    const amt = ok ? Math.round(v * num(r.rate_per_kg) * 100) / 100 : 0, span = inp.parentElement.querySelector('.amt'), row = inp.closest('.item');
    if (span) span.textContent = ok ? rs(amt) : '';
    if (row) row.classList.toggle('on', !!ok);
    if (ok) rows.push({ name: r.item_name, kg: v, rate: r.rate_per_kg, amt });
  });
  lines.innerHTML = billLinesHtml(rows);
  document.getElementById('bill-tkg').textContent = 'Total · ' + kg(rows.reduce((a, r) => a + r.kg, 0)) + ' kg';
  document.getElementById('bill-total').textContent = rs(rows.reduce((a, r) => a + r.amt, 0));
  const send = document.querySelector('[data-act="send"]'); if (send) send.disabled = !rows.length;
}
let saveChain = Promise.resolve(), saving = 0;
function queueSave(billId, itemId, v) {
  saving++;
  saveChain = saveChain
    .then(() => rpc('set_bill_item', { p_bill_id: billId, p_item_id: itemId, p_qty_kg: v, p_photo_url: null, p_typed: true }))
    .catch(e => toast(e.message, true))
    .then(async () => { saving--; if (!saving) { try { await refresh(); render(); liveBill(); } catch (_) {} } });
}
async function act(fn, okMsg) {
  try { await saveChain; } catch (_) {} /* let any weight still being saved finish first */
  if (S.busy) return; S.busy = true; document.body.style.cursor = 'progress'; const bar = $('#topbar'); bar.classList.remove('on'); void bar.offsetWidth; bar.classList.add('on');
  try { const out = await fn(); await refresh(); render(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(out) : okMsg); return out; }
  catch (e) { toast(e.message, true); try { await refresh(); render(); } catch (_) {} }
  finally { S.busy = false; document.body.style.cursor = ''; $('#topbar').classList.remove('on'); }
}

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled || b.tagName === 'INPUT') return;
  const a = b.dataset.act, l = S.activeLead && leadById(S.activeLead);
  if (a === 'logout') return logout();
  if (a === 'fail-open') { openFail(+b.dataset.id); return; }
  if (a === 'fail-close') { closeFail(); return; }
  if (a === 'fail-reason') { S.fail.reason = FAIL_REASONS[+b.dataset.i]; renderFail(); return; }
  if (a === 'fail-submit') { submitFail(); return; }
  if (a === 'to-bill') { const s = document.querySelector('#app .side'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'lead-tab') { S.leadTab = b.dataset.tab; return render(); }
  if (a === 'load-tab') { S.loadTab = +b.dataset.id; return render(); }
  if (a === 'back') { S.activeLead = null; return render(); }
  if (a === 'open-lead') {
    const id = +b.dataset.id; S.method = null;
    await act(async () => { await rpc('start_pickup', { p_lead_id: id }); S.activeLead = id; });
    if (location.hash !== '#pickup') location.hash = 'pickup';
    return;
  }
  if (a === 'send') {
    return act(async () => {
      await rpc('send_bill', { p_bill_id: l.bill_id });
      return buildWhatsApp(l.bill_id);
    }, pdfOk => pdfOk ? 'Bill locked and PDF ready. Now send it on WhatsApp.' : 'Bill locked. The PDF could not be made, so WhatsApp will send the text bill only.');
  }
  if (a === 'share') {
    /* the link itself opens WhatsApp; this records that it was opened */
    return act(() => rpc('mark_bill_shared', { p_bill_id: l.bill_id }));
  }
  if (a === 'share-file') {
    return act(async () => {
      const shared = await sharePdfFile(l.bill_id, l.bill_no);
      if (shared && l.bill_status === 'sent') await rpc('mark_bill_shared', { p_bill_id: l.bill_id });
    });
  }
  if (a === 'confirm') return act(() => rpc('confirm_bill', { p_bill_id: l.bill_id, p_proof_url: null }), 'Customer agreement recorded.');
  if (a === 'method') { S.method = b.dataset.m; render(); if (S.method === 'upi') $('#utr') && $('#utr').focus(); return; }
  if (a === 'pay') {
    const utr = S.method === 'upi' ? ($('#utr') ? $('#utr').value.trim() : '') : null;
    if (S.method === 'upi' && utr.length < 6) { toast('Enter the UTR number from the UPI app.', true); $('#utr') && $('#utr').focus(); return; }
    return act(async () => {
      await rpc('pay_bill', { p_bill_id: l.bill_id, p_method: S.method, p_upi_ref: utr });
      try { await makePdf(l.bill_id); } catch (e) { /* the bill is paid; the PDF can be refreshed later */ }
    }, 'Payment recorded. Lead closed.');
  }
  if (a === 'end-route') {
    return act(() => rpc('end_route'), code => `Route ended. Take load ${code} to the warehouse for weighing.`);
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset.act !== 'qty') return;
  const l = leadById(S.activeLead); if (!l) return;
  const v = parseFloat(t.value);
  if (t.value !== '' && (isNaN(v) || v < 0 || v > 5000)) { toast('Enter a weight between 0 and 5000 kg.', true); return; }
  queueSave(l.bill_id, +t.dataset.item, isNaN(v) ? 0 : v);
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.act === 'qty') liveBill(); });

/* ---------- pickup could not complete ---------- */
const FAIL_REASONS = ['Customer not at home', 'Customer cancelled', 'Phone not reachable', 'Wrong address or location',
  'No scrap, or too little', 'Customer did not agree to the rate', 'Vehicle or other problem on my side', 'Other'];
function openFail(id) {
  if (!leadById(id)) return;
  S.fail = { id, reason: null, note: '' };
  renderFail(); $('#sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden';
}
function closeFail() { S.fail = null; const s = $('#sheet'); s.classList.add('hidden'); s.innerHTML = ''; document.body.style.overflow = ''; }
function failReady() { const f = S.fail; return !!(f && f.reason && (f.reason !== 'Other' || (f.note || '').trim())); }
function renderFail() {
  const f = S.fail, l = f && leadById(f.id), s = $('#sheet'); if (!l) return closeFail();
  if ($('#fail-note')) f.note = $('#fail-note').value;
  s.innerHTML = `<div class="back" data-act="fail-close"></div><div class="panel">
    <div class="row-split" style="align-items:flex-start"><div><div class="eyebrow">${esc(l.lead_code)}</div><h2 id="sheet-t">Pickup could not complete</h2><div class="muted small">${esc(l.customer_name)}${l.area ? ' · ' + esc(l.area) : ''}</div></div>
      <button class="backbtn" data-act="fail-close" aria-label="Close">✕</button></div>
    <div class="muted">Choose the reason. HQ and the warehouse will see it, and the supervisor will give the lead out again.${l.status === 'in_progress' ? ' The weights you entered for this pickup will be discarded.' : ''}</div>
    <div class="reasons">${FAIL_REASONS.map((r, i) => `<button class="opt ${f.reason === r ? 'on' : ''}" data-act="fail-reason" data-i="${i}"><b>${esc(r)}</b></button>`).join('')}</div>
    <div class="field"><label for="fail-note">NOTE ${f.reason === 'Other' ? '(required)' : '(optional)'}</label><textarea id="fail-note" rows="2" maxlength="300" placeholder="e.g. Rang the bell twice, phone switched off">${esc(f.note)}</textarea></div>
    <button class="btn block" data-act="fail-submit" id="fail-go" ${failReady() ? '' : 'disabled'}>Mark as not completed</button></div>`;
}
document.addEventListener('input', e => { if (e.target.id === 'fail-note' && S.fail) { S.fail.note = e.target.value; const g = $('#fail-go'); if (g) g.disabled = !failReady(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.fail) closeFail(); });
async function submitFail() {
  const f = S.fail; if (!failReady()) return;
  const note = ($('#fail-note').value || '').trim(), id = f.id, reason = f.reason;
  const ok = await act(async () => { await rpc('fail_pickup', { p_lead_id: id, p_reason: reason, p_note: note || null }); if (S.activeLead === id) S.activeLead = null; return true; },
    'Marked as not completed. HQ and the warehouse can see the reason.');
  if (ok) closeFail();
}

/* small touches: a light buzz on buttons (phones that support it), numbers selected on focus, show/hide password */
document.addEventListener('click', e => {
  if (e.target.closest('.btn,.opt,.tab,.maplink') && navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
  const pw = e.target.closest('[data-pw]');
  if (pw) { const i = $('#password'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; pw.textContent = show ? 'Hide' : 'Show'; pw.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.qty input:not(:disabled)')) { try { e.target.select(); } catch (_) {} } });

/* ---------- login / logout ---------- */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim(), pw = $('#password').value, err = $('#login-err'), btn = $('#login-btn');
  err.textContent = '';
  if (!email || !pw) { err.textContent = 'Enter your email and password.'; return; }
  btn.classList.add('busy'); btn.textContent = 'Logging in…';
  try { await authCall('password', { email, password: pw }); await start(); }
  catch (e2) { shake(); err.textContent = /invalid/i.test(e2.message) ? 'Wrong email or password.' : e2.message; }
  finally { btn.classList.remove('busy'); btn.textContent = 'Log in'; }
});
function logoutLocal(msg) {
  if (session) fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` } }).catch(() => {});
  session = null; store(SESSION_KEY, undefined); lastKey = null;
  $('#shell').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#login-err').textContent = msg || '';
}
async function start() {
  $('#login').classList.add('hidden'); $('#shell').classList.remove('hidden');
  $('#app').innerHTML = skeleton();
  try {
    await refresh();
    if (!S.profile || S.profile.role !== 'driver') { logout('This login is not set up as a driver. Ask HQ.'); return; }
    $('#who-name').textContent = S.profile.full_name;
    try { const p = JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); if (p.email) $('#who-email').textContent = p.email; } catch (e) {}
    $('#who-mobile').textContent = S.profile.full_name;
    try {
      const fr = S.profile.franchise_id ? (await rest('franchises?select=code,name&id=eq.' + S.profile.franchise_id))[0] : null;
      $('#fr-name').textContent = fr ? fr.name : 'Not assigned'; $('#fr-code').textContent = fr ? fr.code : '';
      $('#fr-code').style.display = fr ? '' : 'none';
      $('#fr-mobile').textContent = fr ? ' · ' + fr.name + ' (' + fr.code + ')' : '';
    } catch (e) { /* the franchise label is optional; the dashboard still works */ }
    $('#who-meta').textContent = [S.profile.territory, S.profile.vehicle_no].filter(Boolean).join(' · ');
    const inProg = S.leads.find(l => l.status === 'in_progress');
    if (inProg) { S.activeLead = inProg.lead_id; await refresh(); }
    render();
  } catch (e) { $('#app').innerHTML = `<div class="card pad"><b>Could not load your data.</b><span class="muted">${esc(e.message)}</span><button class="btn" onclick="location.reload()">Try again</button></div>`; }
}
/* one login per person: the newest login wins; an older device is signed out within about 20 seconds */
let sessChecking = false;
async function checkSession() {
  if (!session || sessChecking || document.visibilityState !== 'visible') return;
  sessChecking = true;
  try { const ok = await rpc('session_valid'); if (ok === false) logout('You were logged out because this account was opened on another device.'); }
  catch (e) { /* offline or a short error: try again next time */ }
  finally { sessChecking = false; }
}
setInterval(checkSession, 20000);
document.addEventListener('visibilitychange', checkSession);
/* lets the phone install this page as an app (full screen, no address bar) */
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('../sw.js').catch(() => {}); });
function logout(msg) { logoutLocal(msg); location.replace('../' + (typeof msg === 'string' && msg ? '?m=' + encodeURIComponent(msg) : '')); }
session && session.access_token ? start() : logout();
</script>
</body>
</html>
