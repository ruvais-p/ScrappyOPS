name: ScrappyOPS CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrappyops-production
  cancel-in-progress: false

jobs:
  build:
    name: Validate Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Django Docker image
        run: docker build -t scrappyops-ci ./backend

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Prepare SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail

            cd /opt/ScrappyOPS
            git pull --ff-only origin main

            cd /opt/ScrappyOPS/backend
            docker compose up -d --build

            docker compose exec -T web \
              python manage.py migrate --noinput

            docker compose exec -T web \
              python manage.py check

            curl --fail --silent --show-error \
              https://scrappymanager.in/healthz
          REMOTE

      - name: Remove temporary SSH files
        if: always()
        run: rm -f ~/.ssh/deploy_key
