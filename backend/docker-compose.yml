# One command starts everything:   docker compose up -d --build
# Parts: db (PostgreSQL), web (this Django server), proxy (Caddy: HTTPS certificates are fetched and renewed automatically).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrappy
      POSTGRES_DB: scrappy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrappy"]
      interval: 10s
      retries: 6

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scrappy:${POSTGRES_PASSWORD}@db:5432/scrappy
      MEDIA_ROOT: /data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
      - ./site:/srv/site:ro        # the website files made by tools/point_frontend.py (leave empty if the website is elsewhere)
    expose:
      - "8000"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, for example api.scrappy.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  media:
  caddy_data:
  caddy_config:
