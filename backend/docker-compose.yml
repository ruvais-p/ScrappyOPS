# One command starts everything:   docker compose up -d --build
# Parts: db (PostgreSQL), web (this Django server), proxy (Caddy: HTTPS certificates are fetched and renewed automatically).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrappy_admin
      POSTGRES_DB: scrappy
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./deploy/init-db-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrappy"]
      interval: 10s
      retries: 6

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scrappy:${POSTGRES_APP_PASSWORD}@db:5432/scrappy
      MEDIA_ROOT: /data/media
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/data/media
      - ./site:/srv/site:ro        # the website files made by tools/point_frontend.py (leave empty if the website is elsewhere)
    expose:
      - "8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, for example api.scrappy.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  media:
  caddy_data:
  caddy_config:
